[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
build_src_filter = +<*.cpp> -<test/> -<Testing/> -<.pio/>
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo

[env:calibration]
extends = env:esp32dev
build_src_filter = -<*> +<test/calibration_main.cpp> +<motor.cpp> +<imu.cpp> +<servo_control.cpp>

[env:test_pwm]
extends = env:esp32dev
build_src_filter = -<*> +<Testing/test_pwm.cpp> +<motor.cpp> +<imu.cpp>

[env:test_speed]
extends = env:esp32dev
build_src_filter = -<*> +<Testing/test_speed.cpp> +<motor.cpp> +<imu.cpp>

[env:test_imu]
extends = env:esp32dev
build_src_filter = -<*> +<Testing/test_imu.cpp> +<motor.cpp> +<imu.cpp>

[env:test_servo]
extends = env:esp32dev
build_src_filter = -<*> +<Testing/test_servo.cpp> +<motor.cpp> +<imu.cpp>

[env:test_pallet]
extends = env:esp32dev
build_src_filter = -<*> +<Testing/test_pallet.cpp> +<motor.cpp> +<imu.cpp> +<servo_control.cpp>
